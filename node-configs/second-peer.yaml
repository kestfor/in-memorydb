node:
  id: "second"
  bind_address: "0.0.0.0"
  port: 50053
seeds:
  - "first"
gossip:
  bind_address: "0.0.0.0"
  port: 50054
  fanout: 3
  interval: 10000
  retries: 2
membership:
  port: 50055
persistence:
  enabled: false
  wal:
    path: ./wal_data_2
    segment_threshold: 10000
security:
  mode: internal
  ca_cert: ./node-configs/certs/ca.crt
  cert: ./node-configs/certs/second/second.crt
  key: ./node-configs/certs/second/second.key
trace:
  enabled: false