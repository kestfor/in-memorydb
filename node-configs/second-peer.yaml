node:
  id: "second"
  bind_address: "0.0.0.0"
  port: 8080
seeds:
  - "192.168.0.45"
gossip:
  bind_address: "0.0.0.0"
  port: 8081
  fanout: 3
  interval: 10s
  retries: 2
membership:
  advertise_addr: "192.168.0.82"
  port: 8082
persistence:
  enabled: false
  wal:
    path: ./wal_data_2
    segment_threshold: 10000
security:
  mode: disabled
  ca_cert: ./node-configs/certs/ca.crt
  cert: ./node-configs/certs/second/second.crt
  key: ./node-configs/certs/second/second.key
trace:
  enabled: false