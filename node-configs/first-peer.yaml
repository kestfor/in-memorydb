node:
  id: "first"
  bind_address: "0.0.0.0"
  port: 8080
gossip:
  bind_address: "0.0.0.0"
  port: 8081
  fanout: 3
  interval: 10000
  retries: 2
membership:
  # advertise_addr задается явно, если запускать узлы на разных физических устройствах.
  # При запуске под docker-compose оставьте advertise_addr пустым, чтобы автоматически использовать IP/интерфейс контейнера.
  # advertise_addr: "192.168.0.1"
  port: 8082
persistence:
  enabled: true
  wal:
    path: ./wal_data_1
    segment_threshold: 10000
security:
  mode: disabled
  ca_cert: ./node-configs/certs/ca.crt
  cert: ./node-configs/certs/first/first.crt
  key: ./node-configs/certs/first/first.key
trace:
  enabled: false
  endpoint: 192.168.0.14:4318
