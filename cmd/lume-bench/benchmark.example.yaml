# LUME Benchmark Configuration Example
# Copy this file and modify for your needs

# Target server
host: "127.0.0.1"
port: 50051

# Test duration per stage (e.g., 30s, 1m, 5m)
duration: 30s

# Total requests (0 = use duration)
# requests: 100000

# Number of concurrent clients
concurrency: 50

# Rate limit (requests per second), 0 = unlimited
rate_limit_rps: 0

# Payload size in bytes
payload_size: 256

# Counter increment step for APPLY tests
counter_step: 1

# Tests to run: set, apply, get, mixed, all
tests:
  - set
  - apply
  - get
  - mixed

# Mixed workload percentages (must sum to 100)
mixed_set_pct: 20
mixed_get_pct: 40
mixed_apply_pct: 30
mixed_delete_pct: 10

# Output settings
output_dir: "./results"
json_output: "results.json"
csv_output: "results.csv"

# Display options
quiet: false
show_progress: true

