services:
  lume:
    container_name: lume
    cpus: "3.0"
    deploy:
      resources:
        limits:
          cpus: "3.00"
    build:
      context: ../../
      dockerfile: ./local_tests/Dockerfile
    ports:
      - "50053:50053"
    environment:
      - LOG_LEVEL=ERROR
    #    volumes:
    #      - wal1:/wal_data
    command: [ "./lume", "--config", "../local_configs/config1.yaml" ]

  redis:
    image: redis:latest
    container_name: redis
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - ./configs/db/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "3.00"
    cpus: 3.0
    restart: unless-stopped

