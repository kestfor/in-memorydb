[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "network"]
  gather_services = false
  container_name_include = [
    "lume",
    "redis",
    "memcached",
    "aerospike"
    "dragonfly"
    "keydb"
    "prometheus",
    "grafana",
    "telegraf",
  ]

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  expiration_interval = "30s"
