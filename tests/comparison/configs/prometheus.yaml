global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "db-test"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8081"
          - "host.docker.internal:8082"
          - "host.docker.internal:8083"

  - job_name: "telegraf-docker"
    metrics_path: /metrics
    static_configs:
      - targets: [ "telegraf:9273" ]

