node:
  id: "node1" # node identification, must be unique across cluster
  bind_address: "127.0.0.1" # main node bind address
  port: 9090 # node port that listens for clients requests
gossip:
  port: 9091 # port for peer-to-peer communication inside the cluster for update transfer
  protocol: "SWIM" # protocol name
  interval: 500 # interval in ms between anti-entropy
  fanout: 3 # num of nodes for random updates distribution
  retries: 3 # num of retries to send data for each node
membership:
  port: 9092 # port for peer-to-peer communication inside the cluster for membership checking
seeds:
  - "195.0.0.2:9090" # list of known seeds to join the cluster
persistence:
  wal:
    path: "wal_dir"
    segment_threshold: 1000 # num of entry in one segment file
  snap_dir: "snap"
  snapshot_interval: 10
security:
  enabled: true
  ca_cert: "ca.crt"
  ca_key: "ca.key"
  cert: "node1.crt"
  key: "node1.key"
